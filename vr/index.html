<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORRERY — foundations prototype</title>
<style>
  :root { color-scheme: dark;
    --bg: #05060a; --panel: rgba(10,13,22,.82); --line: rgba(140,170,255,.16);
    --text: #dfe6f2; --dim: #7f8ca6; --accent: #5b8cff; --accent2: #2f5fd0;
    --ok: #7dd6a0; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font: 12.5px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--text); }
  #c { display:block; width:100%; height:100%; touch-action:none; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui.hidden { display:none; }
  button { pointer-events:auto; font:inherit; font-size:12px; color:var(--text); cursor:pointer;
    background:rgba(255,255,255,.05); border:1px solid var(--line);
    border-radius:7px; padding:6px 9px; transition:background .12s, border-color .12s; }
  button:hover { background:rgba(140,170,255,.14); border-color:rgba(140,170,255,.4); }
  button[aria-pressed="true"] { background:var(--accent2); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  kbd { font:inherit; font-size:10px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
        border-radius:3px; padding:0 4px; }

  #topbar {
    pointer-events:auto; position:absolute; top:10px; left:10px; right:10px; z-index:5;
    display:flex; align-items:center; gap:8px; padding:7px 10px;
    background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:11px;
  }
  #topbar .brand { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#9fc0ff; font-weight:600; }
  #worldchip { flex:1; min-width:0; font:12px ui-monospace, Menlo, monospace; color:#cfe0ff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #worldchip small { color:var(--dim); font-weight:400; }
  #topbar .actions { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  #topbar .actions button { padding:5px 8px; font-size:11.5px; }
  #vrbtn { background:var(--accent2); border-color:var(--accent); color:#fff; font-weight:600; }
  #vrbtn:disabled { background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.12); color:#6a7488; }

  #dock {
    pointer-events:auto; position:absolute; top:58px; left:10px; z-index:4;
    width:min(300px, calc(100vw - 20px)); max-height:calc(100vh - 70px);
    background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line);
    border-radius:12px; padding:8px; display:flex; flex-direction:column; gap:6px; overflow:hidden;
  }
  #dock.collapsed .dock-body, #dock.collapsed .dock-tabs { display:none; }
  .dock-tabs { display:flex; gap:3px; }
  .dock-tabs button { flex:1; font-size:11px; padding:5px 6px; }
  .dock-body { overflow:auto; flex:1; min-height:0; }
  .dock-pane { display:none; }
  .dock-pane.on { display:block; }
  .tools { display:flex; gap:4px; flex-wrap:wrap; }
  .tools button { font-size:11px; padding:4px 7px; }
  .tools-more { display:none; margin-top:6px; padding-top:6px; border-top:1px solid var(--line); }
  .tools-more.open { display:flex; gap:4px; flex-wrap:wrap; }
  #moretools[aria-pressed="true"] { background:rgba(140,170,255,.2); }
  .rules { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
  .rules button { font-size:11px; padding:4px 7px; }
  .view-row { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:11.5px; color:#a8b6ce; }
  .view-row label { min-width:52px; }
  .view-row input[type="range"] { flex:1; accent-color:var(--accent); }
  .view-row input[type="checkbox"] { accent-color:var(--accent); width:13px; height:13px; }
  .view-row .val { min-width:34px; text-align:right; font:11px ui-monospace, Menlo, monospace; color:#cfe0ff; }
  .stats {
    margin-top:4px; padding-top:6px; border-top:1px solid var(--line);
    font:11px/1.55 ui-monospace, Menlo, monospace; color:#8fa0bd;
  }
  .stats b { color:#cfe0ff; font-weight:500; }
  #inspect { display:none; margin-top:6px; font:11px/1.45 ui-monospace, Menlo, monospace; color:#b8c8e0; }
  .dock-foot { display:flex; gap:4px; flex-wrap:wrap; }
  .dock-foot button { font-size:11px; padding:4px 7px; }
  .hint-mini { font-size:10.5px; color:var(--dim); margin:4px 0 0; }

  #catpanel {
    display:none; position:absolute; z-index:6; top:58px; right:10px;
    width:min(380px, calc(100vw - 20px)); max-height:calc(100vh - 70px);
    background:var(--panel); backdrop-filter:blur(16px); border:1px solid var(--line);
    border-radius:12px; padding:10px; pointer-events:auto; overflow:hidden;
    flex-direction:column; gap:6px;
  }
  #catpanel.open { display:flex; }
  #catpanel .cat-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #catpanel h1 { font-size:11px; letter-spacing:.18em; text-transform:uppercase; margin:0; color:#9fc0ff; }
  .cat-nav { display:flex; gap:4px; align-items:center; }
  .cat-nav button { padding:4px 8px; font-size:11px; }
  #catkinds, #catcats { display:flex; flex-wrap:wrap; gap:3px; }
  #catkinds button, #catcats button { font-size:10.5px; padding:3px 7px; }
  #catq { width:100%; font:12px inherit; color:var(--text); background:rgba(0,0,0,.35);
    border:1px solid var(--line); border-radius:7px; padding:6px 8px; }
  #catq:focus { outline:none; border-color:rgba(91,140,255,.7); }
  #catlist { overflow:auto; flex:1; min-height:140px; display:flex; flex-direction:column; gap:3px; }
  .cat-item { text-align:left; padding:7px 8px; border-radius:8px; width:100%;
    display:grid; grid-template-columns:32px 1fr; gap:1px 8px; }
  .cat-item .cid { font:10px ui-monospace, Menlo, monospace; color:var(--dim); padding-top:2px; }
  .cat-item .ct { font-size:12px; font-weight:600; color:#e8eef8; }
  .cat-item .cm { font-size:10px; color:var(--dim); grid-column:2; }
  .cat-item .cd { display:none; }
  .cat-item.BODY { border-color:rgba(125,214,160,.25); }
  .cat-item.BODY:hover { background:rgba(125,214,160,.1); }
  .cat-item.PHYS, .cat-item.UX { opacity:.7; }
  .cat-item[aria-pressed="true"] { background:rgba(47,95,208,.4); border-color:var(--accent); }
  #catmeta { font-size:10.5px; color:var(--dim); }
  #catdetail { font-size:11px; color:#b8c8e0; line-height:1.4; max-height:90px; overflow:auto;
    padding-top:6px; border-top:1px solid var(--line); display:none; }
  #catdetail.show { display:block; }

  #localpanel {
    position:absolute; z-index:3; padding:8px; max-width:none; pointer-events:auto;
    background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:12px;
  }
  #localpanel.snap-tl { top:58px; left:10px; right:auto; bottom:auto; }
  #localpanel.snap-tr { top:58px; right:10px; left:auto; bottom:auto; }
  #localpanel.snap-bl { bottom:10px; left:10px; right:auto; top:auto; }
  #localpanel.snap-br { bottom:10px; right:10px; left:auto; top:auto; }
  #localpanel h1 { font-size:11px; letter-spacing:.16em; text-transform:uppercase; margin:0 0 6px; color:#9fc0ff;
    display:flex; justify-content:space-between; align-items:center; }
  #localview { display:block; width:180px; height:180px; border-radius:7px;
    background:#07090f; border:1px solid rgba(140,170,255,.2); image-rendering:pixelated; }
  #localopts { display:none; margin-top:6px; }
  #localopts.open { display:block; }
  .local-opts { display:flex; flex-direction:column; gap:4px; }
  .local-opt { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .local-opt > span { min-width:36px; font-size:10px; color:var(--dim); letter-spacing:.06em; text-transform:uppercase; }
  .local-opt .seg { display:flex; gap:2px; flex-wrap:wrap; }
  .local-opt .seg button { font-size:10px; padding:2px 6px; }
  #localMove { display:grid; grid-template-columns:repeat(3, 1fr); gap:2px; width:100%; max-width:120px; }
  #localMove button { font-size:10px; padding:3px 0; min-width:0; }
  #localhint { margin:5px 0 0; font-size:10px; color:var(--dim); max-width:180px; }

  #err { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); pointer-events:none;
         background:rgba(180,40,50,.92); padding:8px 14px; border-radius:8px; font-size:12px;
         opacity:0; transition:opacity .3s; max-width:80vw; text-align:center; z-index:20; }
  #err.show { opacity:1; }

  @media (max-width:820px) {
    #dock { width:min(260px, calc(100vw - 20px)); }
    #catpanel { left:10px; right:10px; width:auto; }
  }
</style>
<canvas id="c"></canvas>
<div id="ui">
  <div id="topbar">
    <div class="brand">Orrery</div>
    <div id="worldchip">Terra</div>
    <div class="actions">
      <button type="button" id="catprev" title="Previous world [">‹</button>
      <button type="button" id="catbtn" aria-pressed="false">Worlds</button>
      <button type="button" id="catnext" title="Next world ]">›</button>
      <button type="button" id="pause" aria-pressed="false">Pause</button>
      <button type="button" id="newseed">Reseed</button>
      <button type="button" id="docktoggle" title="Toggle dock">Dock</button>
      <button type="button" id="vrbtn" disabled>VR…</button>
    </div>
  </div>

  <div id="dock">
    <div class="dock-tabs">
      <button type="button" data-tab="tools" aria-pressed="true">Tools</button>
      <button type="button" data-tab="view" aria-pressed="false">View</button>
      <button type="button" data-tab="sandbox" aria-pressed="false">Sandbox</button>
    </div>
    <div class="dock-body">
      <div class="dock-pane on" id="pane-tools">
        <div class="tools" id="tools"></div>
        <button type="button" id="moretools" aria-pressed="false" style="margin-top:6px;width:100%">More tools</button>
        <div class="tools tools-more" id="toolsMore"></div>
        <div class="stats" id="stats"></div>
        <div id="inspect"></div>
      </div>
      <div class="dock-pane" id="pane-view">
        <div class="view-row">
          <label for="opacity">Opacity</label>
          <input type="range" id="opacity" min="15" max="100" value="100" step="1">
          <span class="val" id="opacityVal">100%</span>
        </div>
        <div class="view-row">
          <label for="xray">X-Ray</label>
          <input type="checkbox" id="xray">
          <span class="val" style="text-align:left;flex:1">core / mantle</span>
        </div>
        <div class="view-row" id="xrayRow" style="opacity:0.45;pointer-events:none">
          <label for="xrayAmt">Cut</label>
          <input type="range" id="xrayAmt" min="0" max="85" value="45" step="1">
          <span class="val" id="xrayVal">45%</span>
        </div>
        <div class="view-row">
          <label for="grid">Grid</label>
          <input type="range" id="grid" min="0" max="100" value="0" step="5">
          <span class="val" id="gridVal">off</span>
        </div>
        <p class="hint-mini"><kbd>scroll</kbd> zoom · drag spin · <kbd>R</kbd> reseed · <kbd>space</kbd> pause · <kbd>[ ]</kbd> worlds</p>
      </div>
      <div class="dock-pane" id="pane-sandbox">
        <div class="rules" id="rules"></div>
        <div class="dock-foot">
          <button type="button" id="budget" aria-pressed="false">Budget</button>
          <button type="button" id="autopilot" aria-pressed="false">Gaia</button>
          <button type="button" id="export">Chronicle</button>
        </div>
        <p class="hint-mini">Sandbox presets. Use Worlds for the 120-catalogue.</p>
      </div>
    </div>
  </div>

  <div id="catpanel">
    <div class="cat-head">
      <h1>Catalogue</h1>
      <div class="cat-nav">
        <button type="button" id="catclose">Close</button>
      </div>
    </div>
    <div id="catkinds"></div>
    <input id="catq" type="search" placeholder="Search Europa, TRAPPIST, iron…" autocomplete="off">
    <div id="catcats"></div>
    <div id="catlist"></div>
    <div id="catmeta"></div>
    <div id="catdetail"></div>
  </div>

  <div id="localpanel" class="snap-br">
    <h1>
      <span>Local</span>
      <button type="button" id="localoptsbtn" aria-pressed="false" style="font-size:10px;padding:2px 6px">Opts</button>
    </h1>
    <canvas id="localview" width="180" height="180"></canvas>
    <div id="localopts">
      <div class="local-opts">
        <div class="local-opt"><span>Size</span><div class="seg" id="localSize"></div></div>
        <div class="local-opt"><span>Snap</span><div class="seg" id="localSnap"></div></div>
        <div class="local-opt"><span>Globe</span><div class="seg" id="localGlobe"></div></div>
        <div class="local-opt"><span>Patch</span><div class="seg" id="localRadius"></div></div>
        <div class="local-opt"><span>Move</span><div id="localMove"></div></div>
      </div>
    </div>
    <p id="localhint">Drag map · arrows · Ctrl+click globe</p>
  </div>
</div>
<div id="err"></div>
<script type="module" src="./main.js?v=ui2"></script>
